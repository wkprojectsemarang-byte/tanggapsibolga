<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    

<script>
function cekAkses() {
    var now = new Date();
    var jam = now.getHours();
    var menit = now.getMinutes();

    var waktu = jam * 60 + menit;

    var mulai = 5 * 60; // 05:00 = 300 menit

    if (waktu < mulai) {
        alert("Akses kehadiran dimulai pukul 05:00 WIB!");
        window.location.href = "home.html";
        return;
    }

    // Jika sudah jam 05:00 ke atas
    window.location.href = "aksesAbsen.html";
}

cekAkses();
</script>

 

</body>
</html>
