<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.container{
max-width:400px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.preview{
margin:15px 0;
}

.preview img{
width:100%;
max-height:250px;
object-fit:cover;
border-radius:8px;
}

button{
width:100%;
padding:10px;
border:none;
background:#00aaff;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#008ecc;
}

.progress{
width:100%;
background:#ddd;
border-radius:5px;
margin-top:10px;
}

.progress-bar{
height:10px;
width:0%;
background:#00aaff;
border-radius:5px;
}

#loading{
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.spinner{
  width:50px;
  height:50px;
  border:6px solid #ddd;
  border-top:6px solid #00aaff;
  border-radius:50%;
  animation:putar 1s linear infinite;
}

@keyframes putar{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}


</style>
<body>
<div class="container">
    <label for="imageFile">Klik Tombol untuk Ambil Photo: </label><br>
    <input type="file" id="imageFile" capture="user" accept="image/*" ><br><br>

    



    <div class="preview">
        <img id="preview" src="">
        
    </div>

    <div id="loading" style="display:none;">
        Uploading...
    </div>

   

<button onclick="uploadPhoto()" id="btnupload">Upload</button><br><br>
 <a href="home.html" style="font-size:20px;">Kembali</a>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
   
 // INPUT (UPLOAD) P H O T O
                document.getElementById("imageFile").value = "";
                const input = document.getElementById("imageFile");
                const preview = document.getElementById("preview");

                input.addEventListener("change", function() {
                const file = this.files[0];

                if (file) {
                    const url = URL.createObjectURL(file);
                    preview.src = url;
                    preview.style.display = "block";
                }
                });
 // Your web app's Firebase configuration
        const firebaseConfig = {
           apiKey: "AIzaSyCllT1xEA0kLnT2ceLkQgNrhSsAbvUkaxo",
            authDomain: "item-pekerjaan-84734.firebaseapp.com",
            databaseURL: "https://item-pekerjaan-84734-default-rtdb.firebaseio.com",
            projectId: "item-pekerjaan-84734",
            storageBucket: "item-pekerjaan-84734.firebasestorage.app",
            messagingSenderId: "1090276765966",
            appId: "1:1090276765966:web:8eea263c163d81aa45a75f",
            measurementId: "G-TKNH3Y5C3X"
            };

          firebase.initializeApp(firebaseConfig);


    async function uploadPhoto(){


    const file = document.getElementById("imageFile").files[0];

    if(!file){
        alert("Pilih foto dulu!");
        return;
    }
    loading.style.display = "block"; // tampilkan loading

    const formData = new FormData();

    // file utama
    formData.append("file", file);

    // upload preset dari Cloudinary
    formData.append("upload_preset", "wika-7");

    // PUBLIC ID UNIK (anti overwrite)
    const uniqueId = "foto_" + Date.now();
    formData.append("public_id", uniqueId);

    try {
        const response = await fetch("https://api.cloudinary.com/v1_1/dwzjlkkah/image/upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        console.log("URL:", data.secure_url);

        // tampilkan gambar terbaru (anti cache)
        const imageUrl = data.secure_url + "?t=" + Date.now();
       
        const namabulan = [
        "Januari","Februari","Maret","April","Mei","Juni",
        "Juli","Agustus","September","Oktober","November","Desember"
        ];
        const now = new Date();
        const pulang = "-";
        const bulan = namabulan[now.getMonth()];
        const nama = localStorage.getItem("username");
        const jabatan = "Site Manager of Administratif";
        const tanggal = now.getDate()+String(new Date().getMonth() + 1).padStart(2,'0')+now.getFullYear();
        const tampilanBulan = now.getDate() + " " + bulan + " " + now.getFullYear();
        const mulaiLembur = "-";
         const selesaiLembur = "-";

     let keterangan;

        const jam = now.getHours();
        const menit = now.getMinutes();

        // batas 08:15
        if (jam > 8 || (jam === 8 && menit > 15)) {
            keterangan = "Terlambat";
        } else {
            keterangan = "Tepat Waktu";
        }

         // SIMPAN KE FIREBASE
    firebase.database().ref("absen/"+tanggal+"/"+nama).update({
       photo: imageUrl,
        waktu: now.getHours() + ":" + String(new Date().getMinutes()).padStart(2, '0') + ":" + now.getSeconds()+ " wib",
        date: tampilanBulan,
        nama : nama,
        pulang : pulang,
        mulailembur :mulaiLembur,
        selesailembur : selesaiLembur,
        keterangan : keterangan
     
    });

    firebase.database().ref("periode/"+nama+"/"+tanggal).update({
       photo: imageUrl,
        waktu: now.getHours() + ":" + String(new Date().getMinutes()).padStart(2, '0') + ":" + now.getSeconds()+ " wib",
        date: now.getDate()+String(new Date().getMonth() + 1).padStart(2,'0')+now.getFullYear(),
        nama : nama,
        tanggal:tampilanBulan,
        pulang : pulang,
         mulailembur :mulaiLembur,
        selesailembur : selesaiLembur,
        keterangan : keterangan

     
    });

       document.getElementById("btnupload").style.display = "none";
       loading.style.display = "none"; // hilangkan loading
          Swal.fire({
    position: 'top-end',
    icon: 'success',
    title: 'Berhasil di Upload',
    text: 'jangan lupa melakukan Absensi Pulang,karena hal wajib utk dilaksanakan !! ',
    showConfirmButton: false,
    timer: 5000,
    timerProgressBar: true
});
       
        
     
    } catch (error){
        console.error("Upload gagal:", error);
    }
}

// CEK WAKTU ABSEN (AUTO SAAT HALAMAN DIBUKA)
function cekWaktuAbsen() {
    const now = new Date();

    // Ambil jam & menit
    const jam = now.getHours();
    const menit = now.getMinutes();

    // Batas waktu 08:16
    if (jam > 23|| (jam === 23 && menit >= 15)) {

        Swal.fire({
            icon: 'warning',
            title: 'Waktu Absen Lewat!',
            text: 'Silakan kembali ke halaman utama',
            confirmButtonText: 'OK'
        }).then(() => {
            window.location.href = "home.html";
        });

    }
}

// Jalankan saat halaman load
cekWaktuAbsen();

// Optional: cek tiap 30 detik (biar tetap ke-detect kalau user diam)
setInterval(cekWaktuAbsen, 10000);
</script>
